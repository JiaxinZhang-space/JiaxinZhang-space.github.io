<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>页面未找到｜张佳欣的技术作品集</title>
    <meta name="robots" content="noindex">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <meta name="theme-color" content="#10231d">
    <style>
      :root { color-scheme: light; --bg: #f7f3ea; --ink: #1f211d; --muted: #5f6359; --line: #d8d2c4; --green: #1f5c45; --dark: #10231d; }
      * { box-sizing: border-box; }
      body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 24px; background: linear-gradient(90deg, rgba(31,92,69,.045) 1px, transparent 1px), linear-gradient(rgba(31,92,69,.035) 1px, transparent 1px), var(--bg); background-size: 56px 56px; color: var(--ink); font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      main { width: min(100%, 720px); padding: clamp(32px, 7vw, 72px); border: 1px solid var(--line); border-radius: 8px; background: rgba(255,253,248,.96); box-shadow: 0 18px 50px rgba(32,34,29,.1); }
      .code { margin: 0 0 8px; color: var(--green); font: 700 0.82rem/1.4 ui-monospace, SFMono-Regular, Consolas, monospace; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0; font-size: clamp(2rem, 6vw, 4.4rem); line-height: 1.08; }
      p { max-width: 36rem; margin: 22px 0 30px; color: var(--muted); font-size: 1.05rem; line-height: 1.75; }
      a { display: inline-flex; min-height: 46px; align-items: center; padding: 0 18px; border-radius: 7px; background: var(--dark); color: #fffdf8; font-weight: 700; text-decoration: none; }
      a:focus-visible { outline: 3px solid rgba(183,121,31,.55); outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code">404 / Page not found</p>
      <h1>这个页面不存在</h1>
      <p>链接可能已经更新，或地址输入有误。你可以返回首页继续查看数据仓库、实时计算和 LLM 数据工程项目。</p>
      <a href="/">返回作品集首页</a>
    </main>
  </body>
</html>
